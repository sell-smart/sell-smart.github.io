  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

n  font-weight: 700;\n  font-display: swap;\n  src: url(\"36a561d1-b6ac-46d0-be1d-f16059ea7e1a\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  :root{\n    --white:#FFFFFF; --ink:#111111; --muted:#6B6B6B; --faint:#444; --panel:#F4F4F1; --panel-d:#ECECE8;\n    --red:#E5484D; --red-dk:#C13338; --line:rgba(17,17,17,.13);\n    --type-title:66px; --type-subtitle:40px; --type-body:32px; --type-small:26px; --type-micro:22px;\n    --pad:104px; --gap-title:48px;\n  }\n  *{box-sizing:border-box;}\n  body{margin:0;}\n  .gro{font-family:'Space Grotesk',sans-serif;}\n  .arc{font-family:'Archivo',system-ui,sans-serif;}\n  .eyebrow{display:flex;align-items:center;gap:16px;margin-bottom:var(--gap-title);}\n  .eyebrow span.sq{width:14px;height:14px;background:var(--red);display:block;flex:none;}\n  .eyebrow span.tx{font-family:'Space Grotesk',sans-serif;font-size:var(--type-micro);font-weight:600;letter-spacing:.16em;text-transform:uppercase;}\n<\u002Fstyle>\n<\u002Fhelmet>\n<x-import component-from-global-scope=\"deck-stage\" width=\"1920\" height=\"1080\" hint-size=\"100%,100%\" data-uneditable=\"\">\n\n  <section data-label=\"Title\" data-speaker-notes=\"The whole offer in one question — I help growing Shopify brands separate promotions that actually drive sales from promotions that just give away margin.\" style=\"height:100%;background:var(--white);color:var(--ink);font-family:'Archivo',sans-serif;padding:var(--pad);display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;\">\n    <div style=\"display:flex;justify-content:space-between;align-items:center;\">\n      <div class=\"gro\" style=\"font-size:var(--type-micro);font-weight:600;letter-spacing:.16em;text-transform:uppercase;\">Promotion Incrementality Audit<\u002Fdiv>\n      <div class=\"gro\" style=\"font-size:18px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);\">FIXED SCOPE: ~2 WEEKS<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"max-width:1560px;\">\n      <div class=\"gro\" style=\"font-size:24px;font-weight:600;color:var(--red);margin-bottom:34px;letter-spacing:.01em;\">The one number dashboards never shows you<\u002Fdiv>\n      <h1 class=\"gro\" style=\"font-weight:700;font-size:104px;line-height:1.0;margin:0;letter-spacing:-0.03em;\">How much of the revenue from your promotions would have happened <span style=\"color:var(--red);\">anyway<\u002Fspan>, at full price?<\u002Fh1>\n    <\u002Fdiv>\n    <div style=\"display:flex;justify-content:space-between;align-items:flex-end;border-top:2px solid var(--ink);padding-top:28px;\">\n      <div>\n        <div class=\"gro\" style=\"font-size:var(--type-body);font-weight:700;\">Pavel Logacev<\u002Fdiv>\n        <div class=\"arc\" style=\"font-size:var(--type-small);color:var(--muted);font-weight:500;\">Data science for growing ecommerce brands<\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:11px 30px;margin-top:20px;\">\n          <a href=\"https://pavel.logacev.de\" style=\"display:inline-flex;align-items:center;gap:9px;color:var(--ink);text-decoration:none;\"><svg width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><path d=\"M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20\"><\u002Fpath><path d=\"M2 12h20\"><\u002Fpath><\u002Fsvg><span class=\"gro\" style=\"font-size:20px;font-weight:600;\">pavel.logacev.de<\u002Fspan><\u002Fa>\n          <a href=\"mailto:pavel@logacev.de\" style=\"display:inline-flex;align-items:center;gap:9px;color:var(--ink);text-decoration:none;\"><svg width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"4\" width=\"20\" height=\"16\" rx=\"2\"><\u002Frect><path d=\"m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7\"><\u002Fpath><\u002Fsvg><span class=\"gro\" style=\"font-size:20px;font-weight:600;\">pavel@logacev.de<\u002Fspan><\u002Fa>\n          <a href=\"https://calendly.com/pavel-logacev/price_optim\" style=\"display:inline-flex;align-items:center;gap:9px;color:var(--ink);text-decoration:none;\"><svg width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"18\" height=\"18\" x=\"3\" y=\"4\" rx=\"2\"><\u002Frect><path d=\"M3 10h18\"><\u002Fpath><path d=\"M8 2v4\"><\u002Fpath><path d=\"M16 2v4\"><\u002Fpath><\u002Fsvg><span class=\"gro\" style=\"font-size:20px;font-weight:600;\">Book a call<\u002Fspan><\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"gro\" style=\"font-size:18px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);text-align:right;\">Pricing · Promotion · Demand forecasting<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  \n\n  <section data-label=\"The question\" data-speaker-notes=\"Revenue going up during a promotion doesn't mean the promotion caused it. The real question is how much you'd have earned anyway, at full margin. The gap between those is pure margin given away.\" style=\"height:100%;background:var(--white);color:var(--ink);font-family:'Archivo',sans-serif;padding:var(--pad);display:flex;flex-direction:column;position:relative;overflow:hidden;\">\n    <div class=\"eyebrow\"><span class=\"sq\"><\u002Fspan><span class=\"tx\">The question you can't answer today<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:0;flex:1;align-content:center;\">\n      <div style=\"padding-right:80px;\">\n        <div class=\"gro\" style=\"font-size:18px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:26px;\">What your dashboard shows<\u002Fdiv>\n        <p class=\"gro\" style=\"font-size:54px;line-height:1.1;margin:0;font-weight:700;letter-spacing:-.02em;\">Revenue goes up when you run a promotion.<\u002Fp>\n        <p class=\"arc\" style=\"font-size:var(--type-small);line-height:1.5;color:var(--faint);margin:22px 0 34px;font-weight:500;\">So every promotion looks like a win.<\u002Fp>\n        <div style=\"display:flex;flex-wrap:wrap;gap:12px;\">\n          <span class=\"gro\" style=\"font-size:20px;font-weight:600;padding:12px 22px;background:var(--panel);color:var(--faint);\">20% off<\u002Fspan>\n          <span class=\"gro\" style=\"font-size:20px;font-weight:600;padding:12px 22px;background:var(--panel);color:var(--faint);\">Free-shipping threshold<\u002Fspan>\n          <span class=\"gro\" style=\"font-size:20px;font-weight:600;padding:12px 22px;background:var(--panel);color:var(--faint);\">BOGO<\u002Fspan>\n          <span class=\"gro\" style=\"font-size:20px;font-weight:600;padding:12px 22px;background:var(--panel);color:var(--faint);\">Seasonal sale<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding-left:80px;border-left:1px solid var(--line);\">\n        <div class=\"gro\" style=\"font-size:18px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--red);margin-bottom:26px;\">What it can't show<\u002Fdiv>\n        <p class=\"gro\" style=\"font-size:54px;line-height:1.1;margin:0;font-weight:700;letter-spacing:-.02em;\">What you'd have earned <span style=\"color:var(--red);\">anyway<\u002Fspan>, at full price.<\u002Fp>\n        <p class=\"arc\" style=\"font-size:var(--type-small);line-height:1.5;color:var(--faint);margin:22px 0 0;font-weight:500;\">With no promotion at all.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border-top:2px solid var(--ink);padding-top:30px;\">\n      <p class=\"gro\" style=\"font-size:34px;line-height:1.24;margin:0;font-weight:500;\">The gap between the two is the only thing the promotion actually created. <span style=\"color:var(--red);\">The rest is margin you gave away.<\u002Fspan><\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"What it costs\" data-speaker-notes=\"For most stores, 40–70% of promotional sales would have happened anyway, at full price — those buyers were coming regardless. The discount handed to them is pure margin: it comes out of profit, not cost. And you never see it, because the dashboard shows what sold, not what you would have sold without the promotion. Across a year of promotions, this is the biggest margin loss you can actually control.\" style=\"height:100%;background:var(--white);color:var(--ink);font-family:'Archivo',sans-serif;padding:var(--pad);display:flex;flex-direction:column;position:relative;overflow:hidden;\">\n    <div class=\"eyebrow\"><span class=\"sq\"><\u002Fspan><span class=\"tx\">What it's costing you<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:0.95fr 1.05fr;gap:84px;flex:1;align-items:center;\">\n      <div>\n        <div class=\"gro\" style=\"font-size:184px;font-weight:700;line-height:0.9;letter-spacing:-0.04em;color:var(--red);\">40–70%<\u002Fdiv>\n        <p class=\"gro\" style=\"font-size:34px;line-height:1.2;margin:28px 0 0;font-weight:500;\">of your promotional sales would have happened anyway, at full price.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border-left:1px solid var(--line);padding-left:64px;\">\n        <p class=\"gro\" style=\"font-size:42px;line-height:1.18;margin:0;font-weight:600;letter-spacing:-.01em;\">On every one of those, the discount is <span style=\"color:var(--red);\">pure margin<\u002Fspan> — it comes out of profit, not cost.<\u002Fp>\n        <p class=\"arc\" style=\"font-size:var(--type-small);line-height:1.55;color:var(--faint);margin:26px 0 0;font-weight:500;\">And you never see it: the dashboard shows what sold, not what you'd have sold without the promotion.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border-top:2px solid var(--ink);padding-top:28px;\">\n      <p class=\"gro\" style=\"font-size:32px;line-height:1.25;margin:0;font-weight:600;\">Across a year of promotions, this is the <span style=\"color:var(--red);\">biggest margin loss you can actually control<\u002Fspan>.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"In the numbers\" data-speaker-notes=\"The mechanism, made concrete. One $100 product, 20% COGS, run at 30% off, 100 units sold during the promo. If 40% were coming anyway: without the promo 40 × $80 = $3,200, with the promo 100 × $50 = $5,000 — so +$1,800, the promotion wins. If 70% were coming anyway: 70 × $80 = $5,600 vs $5,000 — so −$600, it loses. The dashboard shows the same 100 units and the same $5,000 margin either way; only the baseline tells the win and the loss apart.\" style=\"height:100%;background:var(--white);color:var(--ink);font-family:'Archivo',sans-serif;padding:var(--pad);display:flex;flex-direction:column;position:relative;overflow:hidden;\">\n    <div class=\"eyebrow\"><span class=\"sq\"><\u002Fspan><span class=\"tx\"><span style=\"letter-spacing: 3.52px;\">What it's costing you<\u002Fspan><\u002Fspan><\u002Fdiv>\n    <div style=\"flex:1;display:flex;flex-direction:column;justify-content:center;\">\n      <p class=\"gro\" style=\"font-size: 38px; line-height: 1.22; margin: 0; font-weight: 600; letter-spacing: -.01em; max-width: 1640px; width: 1713px; height: 141px\">Consider a $100 product at <span style=\"color: var(--red);\">30% off<\u002Fspan>, with 100 units sold. Whether the promotion made money or lost it depends on the one number your dashboard never shows — how many of those buyers were going to buy anyway.<\u002Fp>\n      <div style=\"display:flex;flex-wrap:wrap;gap:12px;margin:26px 0 36px;\">\n        <span class=\"gro\" style=\"font-size:19px;font-weight:600;padding:11px 20px;background:var(--panel);color:var(--faint);\">List price $100<\u002Fspan>\n        <span class=\"gro\" style=\"font-size:19px;font-weight:600;padding:11px 20px;background:var(--panel);color:var(--faint);\">COGS $20<\u002Fspan>\n        <span class=\"gro\" style=\"font-size:19px;font-weight:600;padding:11px 20px;background:var(--panel);color:var(--faint);\">Full-price margin $80<\u002Fspan>\n        <span class=\"gro\" style=\"font-size:19px;font-weight:600;padding:11px 20px;background:var(--panel);color:var(--faint);\">Promo margin $50<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:36px;\">\n        <div style=\"background:var(--panel);border-top:5px solid var(--red);padding:40px 44px;display:flex;flex-direction:column;\">\n          <div class=\"gro\" style=\"font-size:30px;font-weight:700;letter-spacing:-.01em;\">If 40% were going to buy anyway<\u002Fdiv>\n          <div class=\"gro\" style=\"font-size:18px;font-weight:600;letter-spacing:.02em;color:var(--muted);margin-top:9px;\">40 baseline buyers · 60 won by the promo<\u002Fdiv>\n          <div style=\"margin-top:30px;display:flex;flex-direction:column;gap:15px;\">\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:24px;\">\n              <span class=\"arc\" style=\"font-size:23px;color:var(--faint);font-weight:500;\">Without the promo&nbsp;&nbsp;<span style=\"color:var(--muted);\">40 × $80<\u002Fspan><\u002Fspan>\n              <span class=\"gro\" style=\"font-size:30px;font-weight:700;\">$3,200<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:24px;\">\n              <span class=\"arc\" style=\"font-size:23px;color:var(--faint);font-weight:500;\">With the promo&nbsp;&nbsp;<span style=\"color:var(--muted);\">100 × $50<\u002Fspan><\u002Fspan>\n              <span class=\"gro\" style=\"font-size:30px;font-weight:700;\">$5,000<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-top:2px solid var(--ink);margin-top:24px;padding-top:22px;display:flex;justify-content:space-between;align-items:center;gap:16px;\">\n            <span class=\"gro\" style=\"font-size:20px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;\">Promotion wins<\u002Fspan>\n            <span class=\"gro\" style=\"font-size:56px;font-weight:700;line-height:0.9;letter-spacing:-.02em;\">+$1,800<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:var(--panel);border-top:5px solid var(--red);padding:40px 44px;display:flex;flex-direction:column;\">\n          <div class=\"gro\" style=\"font-size:30px;font-weight:700;letter-spacing:-.01em;\">If 70% were going to buy anyway<\u002Fdiv>\n          <div class=\"gro\" style=\"font-size:18px;font-weight:600;letter-spacing:.02em;color:var(--muted);margin-top:9px;\">70 baseline buyers · 30 won by the promo<\u002Fdiv>\n          <div style=\"margin-top:30px;display:flex;flex-direction:column;gap:15px;\">\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:24px;\">\n              <span class=\"arc\" style=\"font-size:23px;color:var(--faint);font-weight:500;\">Without the promo&nbsp;&nbsp;<span style=\"color:var(--muted);\">70 × $80<\u002Fspan><\u002Fspan>\n              <span class=\"gro\" style=\"font-size:30px;font-weight:700;\">$5,600<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:24px;\">\n              <span class=\"arc\" style=\"font-size:23px;color:var(--faint);font-weight:500;\">With the promo&nbsp;&nbsp;<span style=\"color:var(--muted);\">100 × $50<\u002Fspan><\u002Fspan>\n              <span class=\"gro\" style=\"font-size:30px;font-weight:700;\">$5,000<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-top:2px solid var(--ink);margin-top:24px;padding-top:22px;display:flex;justify-content:space-between;align-items:center;gap:16px;\">\n            <span class=\"gro\" style=\"font-size:20px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--red);\">Promotion loses<\u002Fspan>\n            <span class=\"gro\" style=\"font-size:56px;font-weight:700;line-height:0.9;letter-spacing:-.02em;color:var(--red);\">−$600<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border-top:2px solid var(--ink);padding-top:28px;\">\n      <p class=\"gro\" style=\"font-size:30px;line-height:1.25;margin:0;font-weight:600;\">Same product, same discount, the <span style=\"color:var(--red);\">same $5,000<\u002Fspan> on your dashboard — the win and the loss look identical until you know the baseline.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Why dashboards miss it\" data-speaker-notes=\"Dashboards and discount apps report units, revenue, and conversion rate — what happened during the promotion. None of it is lift. Lift is the difference versus what would have happened anyway, and six things look like it. Cannibalization: the discounted product sells more, but the drop in your full-price products is never counted. Pull-forward: sales jump during the promotion week, but the slow week that follows never shows up. Seasonal sales spikes: you ran it during a busy season you didn't create, so the season's own sales get credited to the promotion. Attribution overlap: email, ads, and a product launch ran at the same time with no holdout, so the promotion takes their credit. Targeted discounts: a targeted code reaches people already likely to buy and they redeem it, so the orders look like lift the discount didn't create — selection, not lift. Discounting into a dip (mean reversion): you discount during a slow period and the natural return to normal looks like lift. The one thing that does NOT belong here is customers who would have bought anyway: a correct baseline already removes them, so they never reach the estimate. Measuring lift is a causal-inference problem, not a reporting one.\" style=\"height:100%;background:var(--white);color:var(--ink);font-family:'Archivo',sans-serif;padding:var(--pad);display:flex;flex-direction:column;position:relative;overflow:hidden;\">\n    <div class=\"eyebrow\"><span class=\"sq\"><\u002Fspan><span class=\"tx\">Why your dashboards and apps don't answer it<\u002Fspan><\u002Fdiv>\n    <div style=\"margin-bottom:24px;\">\n      <h2 class=\"gro\" style=\"font-size:54px;line-height:1.08;margin:0 0 10px;font-weight:700;letter-spacing:-.02em;max-width:1680px;\">Your dashboard reports what sold — not what the promotion <span style=\"color:var(--red);\">caused<\u002Fspan>.<\u002Fh2><p class=\"arc\" style=\"font-size:24px;line-height:1.4;color:var(--faint);margin:0;font-weight:500;\">Units, revenue, conversion rate — all measured <em>during<\u002Fem> the promotion. None of it is lift.<\u002Fp>\n      \n    <\u002Fdiv>\n    <div class=\"gro\" style=\"font-size: 16px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--red); margin-bottom: 16px; margin-top: 20px\">Six things that look like lift<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:16px;flex:1;align-content:start;\">\n      <div style=\"background:var(--panel);padding:18px 20px;border-top:5px solid var(--red);\">\n        <div class=\"gro\" style=\"font-size:20px;font-weight:700;color:var(--red);margin-bottom:10px;\">01<\u002Fdiv>\n        <p class=\"gro\" style=\"font-size:24px;line-height:1.1;margin:0 0 9px;font-weight:700;\">Cannibalization<\u002Fp>\n        <p class=\"arc\" style=\"font-size:16px;line-height:1.4;color:var(--faint);margin:0;font-weight:500;\">The discounted product sells more, but the drop in your full-price products is never counted.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:var(--panel);padding:18px 20px;border-top:5px solid var(--red);\">\n        <div class=\"gro\" style=\"font-size:20px;font-weight:700;color:var(--red);margin-bottom:10px;\">02<\u002Fdiv>\n        <p class=\"gro\" style=\"font-size:24px;line-height:1.1;margin:0 0 9px;font-weight:700;\">Pull-forward<\u002Fp>\n        <p class=\"arc\" style=\"font-size:16px;line-height:1.4;color:var(--faint);margin:0;font-weight:500;\">Sales jump during the promo week, but the slow week that follows never shows up in the report.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:var(--panel);padding:18px 20px;border-top:5px solid var(--red);\">\n        <div class=\"gro\" style=\"font-size:20px;font-weight:700;color:var(--red);margin-bottom:10px;\">03<\u002Fdiv>\n        <p class=\"gro\" style=\"font-size:24px;line-height:1.1;margin:0 0 9px;font-weight:700;\">Seasonal sales spikes<\u002Fp>\n        <p class=\"arc\" style=\"font-size:16px;line-height:1.4;color:var(--faint);margin:0;font-weight:500;\">You run it during a busy season you didn't create. The season's own sales get credited to the discount.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:var(--panel);padding:18px 20px;border-top:5px solid var(--red);\">\n        <div class=\"gro\" style=\"font-size:20px;font-weight:700;color:var(--red);margin-bottom:10px;\">04<\u002Fdiv>\n        <p class=\"gro\" style=\"font-size:24px;line-height:1.1;margin:0 0 4px;font-weight:700;\">Attribution overlap<\u002Fp>\n        <p class=\"gro\" style=\"font-size:14px;line-height:1;margin:0 0 9px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);\">(CONCURRENT MARKETING)<\u002Fp>\n        <p class=\"arc\" style=\"font-size:16px;line-height:1.4;color:var(--faint);margin:0;font-weight:500;\">Email, ads, and a product launch run at the same time. Without a holdout, the discount takes all the credit.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:var(--panel);padding:18px 20px;border-top:5px solid var(--red);\">\n        <div class=\"gro\" style=\"font-size:20px;font-weight:700;color:var(--red);margin-bottom:10px;\">05<\u002Fdiv>\n        <p class=\"gro\" style=\"font-size:24px;line-height:1.1;margin:0 0 9px;font-weight:700;\">Targeted discounts<\u002Fp>\n        <p class=\"arc\" style=\"font-size:16px;line-height:1.4;color:var(--faint);margin:0;font-weight:500;\">A targeted discount code reaches people already likely to buy. They redeem it, so the orders look like lift the discount didn't create.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:var(--panel);padding:18px 20px;border-top:5px solid var(--red);\">\n        <div class=\"gro\" style=\"font-size:20px;font-weight:700;color:var(--red);margin-bottom:10px;\">06<\u002Fdiv>\n        <p class=\"gro\" style=\"font-size:24px;line-height:1.1;margin:0 0 9px;font-weight:700;\">Discounting into a dip<\u002Fp>\n        \n        <p class=\"arc\" style=\"font-size:16px;line-height:1.4;color:var(--faint);margin:0;font-weight:500;\">You discount during a slow period. What looks like lift may be just the natural return to normal sales.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border-top:2px solid var(--ink);padding-top:20px;margin-top:18px;\">\n      <p class=\"gro\" style=\"font-size:28px;line-height:1.15;margin:0;font-weight:500;\">Lift is a <span style=\"color:var(--red);\">difference<\u002Fspan> — the promotion minus what would have happened anyway. Measuring it is causal inference, not reporting.<\u002Fp>\n      \n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"What I deliver\" data-speaker-notes=\"The deliverable: a Promotion Incrementality Audit. A clear, numbers-based answer on every type of promotion you run, ranked by what it actually does to profit.\" style=\"height:100%;background:var(--panel);color:var(--ink);font-family:'Archivo',sans-serif;padding:var(--pad);display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden;\">\n    <div class=\"eyebrow\"><span class=\"sq\"><\u002Fspan><span class=\"tx\">What I deliver<\u002Fspan><\u002Fdiv>\n    <h2 class=\"gro\" style=\"font-weight:700;font-size:80px;line-height:1.04;margin:0;max-width:1560px;letter-spacing:-0.03em;\"><span style=\"color:var(--red);\">A Promotion Incrementality Audit:<\u002Fspan> <br>A clear&nbsp; answer on every type of promotion you run, ranked by what it actually does to <span style=\"color: var(--red);\">profit<\u002Fspan>.<\u002Fh2>\n    <div style=\"display:flex;gap:40px;margin-top:58px;align-items:center;\">\n      <div class=\"gro\" style=\"font-size:24px;font-weight:600;color:var(--muted);\">Not a chart.<\u002Fdiv>\n      <div class=\"gro\" style=\"font-size:28px;font-weight:700;\">An answer you can act on.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"What you keep\" data-speaker-notes=\"Four things you keep: a profit breakdown by promotion type, a ranked list of what makes money versus what costs you, a decision rule for the rest, and a short summary deck for whoever runs your marketing.\" style=\"height:100%;background:var(--white);color:var(--ink);font-family:'Archivo',sans-serif;padding:var(--pad);display:flex;flex-direction:column;position:relative;overflow:hidden;\">\n    <div class=\"eyebrow\"><span class=\"sq\"><\u002Fspan><span class=\"tx\">What you keep<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:32px;flex:1;align-content:center;\">\n      <div style=\"background:var(--panel);padding:42px;border-top:5px solid var(--red);\">\n        <div class=\"gro\" style=\"font-size:24px;font-weight:700;color:var(--red);margin-bottom:18px;\">01<\u002Fdiv>\n        <p class=\"gro\" style=\"font-size:30px;line-height:1.18;margin:0;font-weight:600;\">A profit breakdown by promotion type<\u002Fp>\n        <p class=\"arc\" style=\"font-size:var(--type-micro);line-height:1.5;color:var(--faint);margin:14px 0 0;font-weight:500;\">True incremental units, revenue, and margin for each promotion type, after removing baseline, pull-forward, and cannibalization.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:var(--panel);padding:42px;border-top:5px solid var(--red);\">\n        <div class=\"gro\" style=\"font-size:24px;font-weight:700;color:var(--red);margin-bottom:18px;\">02<\u002Fdiv>\n        <p class=\"gro\" style=\"font-size:30px;line-height:1.18;margin:0;font-weight:600;\">A ranked list of promos<\u002Fp>\n        <p class=\"arc\" style=\"font-size:var(--type-micro);line-height:1.5;color:var(--faint);margin:14px 0 0;font-weight:500;\">Which ones make money and which quietly lose money, measured in margin, not total revenue.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:var(--panel);padding:42px;border-top:5px solid var(--red);\">\n        <div class=\"gro\" style=\"font-size:24px;font-weight:700;color:var(--red);margin-bottom:18px;\">03<\u002Fdiv>\n        <p class=\"gro\" style=\"font-size:30px;line-height:1.18;margin:0;font-weight:600;\">A decision rule for the rest<\u002Fp>\n        <p class=\"arc\" style=\"font-size:var(--type-micro);line-height:1.5;color:var(--faint);margin:14px 0 0;font-weight:500;\">When a promotion is worth running, how big it should be, and on which products.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:var(--ink);color:var(--white);padding:42px;border-top:5px solid var(--red);\">\n        <div class=\"gro\" style=\"font-size:24px;font-weight:700;color:var(--red);margin-bottom:18px;\">04<\u002Fdiv>\n        <p class=\"gro\" style=\"font-size:30px;line-height:1.18;margin:0;font-weight:600;\">A short summary deck<\u002Fp>\n        <p class=\"arc\" style=\"font-size:var(--type-micro);line-height:1.5;color:rgba(255,255,255,.7);margin:14px 0 0;font-weight:500;\">Ready to share with whoever runs your marketing.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"How it works\" data-speaker-notes=\"Build a baseline demand model from order history. Treat each promotion as a natural experiment: actual sales versus the model's estimate of what would have happened without it. Break the lift down, then value it in real margin. Map back to the six: the baseline handles seasonal spikes and discounting-into-a-dip, and the breakdown removes pull-forward and cannibalization, so the model handles four of the six. The last two, attribution overlap and targeted discounts, can't be separated from past data alone. I flag them and recommend a clean holdout test, which is the natural follow-on engagement.\" style=\"height:100%;background:var(--white);color:var(--ink);font-family:'Archivo',sans-serif;padding:var(--pad);display:flex;flex-direction:column;position:relative;overflow:hidden;\">\n    <div class=\"eyebrow\"><span class=\"sq\"><\u002Fspan><span class=\"tx\">How it works<\u002Fspan><\u002Fdiv>\n    <h2 class=\"gro\" style=\"font-size:46px;line-height:1.12;margin:0 0 36px;font-weight:600;letter-spacing:-.02em;max-width:1680px;\">A baseline demand model turns each promotion into an <span style=\"color:var(--red);\">experiment<\u002Fspan> — and stays honest about what data alone can't show.<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:0;flex:1;align-content:center;\">\n      <div style=\"padding-right:48px;border-right:1px solid var(--line);\">\n        <div class=\"gro\" style=\"font-size:22px;font-weight:700;color:var(--red);margin-bottom:18px;\">Step 1<\u002Fdiv>\n        <p class=\"gro\" style=\"font-size:30px;line-height:1.14;margin:0;font-weight:600;\">Build a baseline demand model<\u002Fp>\n        <p class=\"arc\" style=\"font-size:var(--type-micro);line-height:1.45;color:var(--faint);margin:14px 0 0;font-weight:500;\">What each product sells at full price — accounting for seasonality, day of week, trend, and stock.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"padding:0 48px;border-right:1px solid var(--line);\">\n        <div class=\"gro\" style=\"font-size:22px;font-weight:700;color:var(--red);margin-bottom:18px;\">Step 2<\u002Fdiv>\n        <p class=\"gro\" style=\"font-size:30px;line-height:1.14;margin:0;font-weight:600;\">Treat each promo as a natural experiment<\u002Fp>\n        <p class=\"arc\" style=\"font-size:var(--type-micro);line-height:1.45;color:var(--faint);margin:14px 0 0;font-weight:500;\">Actual sales vs. the model's estimate of what you'd have sold without it. The difference is possible lift.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"padding-left:48px;\">\n        <div class=\"gro\" style=\"font-size:22px;font-weight:700;color:var(--red);margin-bottom:18px;\">Step 3<\u002Fdiv>\n        <p class=\"gro\" style=\"font-size:30px;line-height:1.14;margin:0;font-weight:600;\">Break it down, value it in margin<\u002Fp>\n        <p class=\"arc\" style=\"font-size:var(--type-micro);line-height:1.45;color:var(--faint);margin:14px 0 0;font-weight:500;\">Split lift into incremental, pulled-forward, and cannibalized — then value it in real margin, not revenue.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border-top:2px solid var(--ink);padding-top:24px;display:grid;grid-template-columns:1fr 1fr;gap:64px;\">\n      <div>\n        <div class=\"gro\" style=\"font-size:16px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;\">Four of the six, handled by the model<\u002Fdiv>\n        <p class=\"arc\" style=\"font-size:var(--type-micro);line-height:1.5;color:var(--faint);margin:0;font-weight:500;\">Baseline removes <span style=\"color:var(--ink);font-weight:700;\">seasonal spikes<\u002Fspan> and <span style=\"color:var(--ink);font-weight:700;\">discounting into a dip<\u002Fspan>; the breakdown removes <span style=\"color:var(--ink);font-weight:700;\">pull-forward<\u002Fspan> and <span style=\"color:var(--ink);font-weight:700;\">cannibalization<\u002Fspan>.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border-left:1px solid var(--line);padding-left:64px;\">\n        <div class=\"gro\" style=\"font-size:16px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--red);margin-bottom:12px;\">The other two → your next test<\u002Fdiv>\n        <p class=\"arc\" style=\"font-size:var(--type-micro);line-height:1.5;color:var(--faint);margin:0;font-weight:500;\"><span style=\"color:var(--ink);font-weight:700;\">Attribution overlap<\u002Fspan> and <span style=\"color:var(--ink);font-weight:700;\">targeted discounts<\u002Fspan> can't be untangled from past data — so I flag them and design the holdout that can.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Why me\" data-speaker-notes=\"Credibility slide: who I am, what I do, and track record, placed right before the qualifier and the ask. Six years building pricing and promotion models for large retailers and restaurant chains, plus a PhD and over a decade of causal and statistical modelling. What I do: bring the methods big retailers run on to growing Shopify brands. Track record: a global sporting-goods retailer (volume up, margin down, a six-figure pricing programme); an international pizza chain (assigned discounted revenue across overlapping, multi-deal orders); and a challenger snack brand (genuine lift versus margin given away). Client names withheld here, anonymized for sharing; speak to them only verbally, under NDA.\" style=\"height:100%;background:var(--white);color:var(--ink);font-family:'Archivo',sans-serif;padding:var(--pad);display:flex;flex-direction:column;position:relative;overflow:hidden;\">\n    <div class=\"eyebrow\"><span class=\"sq\"><\u002Fspan><span class=\"tx\">Why me<\u002Fspan><\u002Fdiv>\n    <div style=\"flex:1;display:grid;grid-template-columns:0.92fr 1.08fr;gap:80px;align-content:center;\">\n      <div>\n        <div class=\"gro\" style=\"font-size:16px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--red);margin-bottom:24px;\">Who I am<\u002Fdiv>\n        <p class=\"gro\" style=\"font-size:42px;line-height:1.16;margin:0;font-weight:500;letter-spacing:-.01em;\">Six years building the pricing and promotion models large retailers and restaurant chains run on — plus a PhD and a decade of causal modeling.<\u002Fp>\n        <p class=\"gro\" style=\"font-size:30px;line-height:1.25;margin:32px 0 0;color:var(--red);font-weight:700;\">I bring those methods to growing Shopify brands. That's the gap I fill.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border-left:1px solid var(--line);padding-left:64px;\">\n        <div class=\"gro\" style=\"font-size:16px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--red);margin-bottom:24px;\">Track record<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;\">\n          <div style=\"padding-bottom:24px;\">\n            <div class=\"gro\" style=\"font-size:25px;font-weight:700;margin-bottom:6px;\">Global sporting-goods retailer<\u002Fdiv>\n            <p class=\"arc\" style=\"font-size:20px;line-height:1.42;color:var(--faint);margin:0;font-weight:500;\">Volume rose, margin fell — the classic \"more sales, less profit.\" It shaped a six-figure pricing programme.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"padding:24px 0;border-top:1px solid var(--line);\">\n            <div class=\"gro\" style=\"font-size:25px;font-weight:700;margin-bottom:6px;\">International pizza chain<\u002Fdiv>\n            <p class=\"arc\" style=\"font-size:20px;line-height:1.42;color:var(--faint);margin:0;font-weight:500;\">Assigned discounted revenue correctly across overlapping, multi-deal orders — measuring what a deal really costs.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"padding-top:24px;border-top:1px solid var(--line);\">\n            <div class=\"gro\" style=\"font-size:25px;font-weight:700;margin-bottom:6px;\">Challenger snack brand<\u002Fdiv>\n            <p class=\"arc\" style=\"font-size:20px;line-height:1.42;color:var(--faint);margin:0;font-weight:500;\">Separated genuine lift from margin given away — the exact question this audit answers.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:11px 30px;border-top:2px solid var(--ink);padding-top:26px;\">\n      <a href=\"https://pavel.logacev.de\" style=\"display:inline-flex;align-items:center;gap:9px;color:var(--ink);text-decoration:none;\"><svg width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><path d=\"M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20\"><\u002Fpath><path d=\"M2 12h20\"><\u002Fpath><\u002Fsvg><span class=\"gro\" style=\"font-size:20px;font-weight:600;\">pavel.logacev.de<\u002Fspan><\u002Fa>\n      <a href=\"mailto:pavel@logacev.de\" style=\"display:inline-flex;align-items:center;gap:9px;color:var(--ink);text-decoration:none;\"><svg width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"4\" width=\"20\" height=\"16\" rx=\"2\"><\u002Frect><path d=\"m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7\"><\u002Fpath><\u002Fsvg><span class=\"gro\" style=\"font-size:20px;font-weight:600;\">pavel@logacev.de<\u002Fspan><\u002Fa>\n      <a href=\"https://calendly.com/pavel-logacev/price_optim\" style=\"display:inline-flex;align-items:center;gap:9px;color:var(--ink);text-decoration:none;\"><svg width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"18\" height=\"18\" x=\"3\" y=\"4\" rx=\"2\"><\u002Frect><path d=\"M3 10h18\"><\u002Fpath><path d=\"M8 2v4\"><\u002Fpath><path d=\"M16 2v4\"><\u002Fpath><\u002Fsvg><span class=\"gro\" style=\"font-size:20px;font-weight:600;\">Book a call<\u002Fspan><\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Is this you?\" data-speaker-notes=\"Good fit: you run promotions regularly, 12+ months of order history, promotions are a large part of revenue. Not a fit: you rarely run promotions or you're too early to have a promotion history.\" style=\"height:100%;background:var(--white);color:var(--ink);font-family:'Archivo',sans-serif;padding:var(--pad);display:flex;flex-direction:column;position:relative;overflow:hidden;\">\n    <div class=\"eyebrow\"><span class=\"sq\"><\u002Fspan><span class=\"tx\">Is this you?<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:48px;flex:1;align-content:center;\">\n      <div style=\"background:var(--panel);padding:54px;border-top:5px solid var(--red);\">\n        <div class=\"gro\" style=\"font-size:var(--type-small);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--red);margin-bottom:28px;\">Good fit<\u002Fdiv>\n        <ul style=\"list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:22px;\">\n          <li class=\"gro\" style=\"font-size:30px;line-height:1.22;font-weight:600;\">You run promotions regularly<\u002Fli>\n          <li class=\"gro\" style=\"font-size:30px;line-height:1.22;font-weight:600;\">You have at least ~12 months of order history<\u002Fli>\n          <li class=\"gro\" style=\"font-size:30px;line-height:1.22;font-weight:600;\">Promotions are a large part of your revenue<\u002Fli>\n        <\u002Ful>\n        <p class=\"arc\" style=\"font-size:var(--type-micro);color:var(--faint);margin:30px 0 0;line-height:1.5;font-weight:500;\">The more promotions you run, the bigger the result.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border:1px solid var(--line);padding:54px;\">\n        <div class=\"gro\" style=\"font-size:var(--type-small);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:28px;\">Not a fit<\u002Fdiv>\n        <ul style=\"list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:22px;\">\n          <li class=\"gro\" style=\"font-size:30px;line-height:1.22;font-weight:600;color:var(--muted);\">You almost never run promotions<\u002Fli>\n          <li class=\"gro\" style=\"font-size:30px;line-height:1.22;font-weight:600;color:var(--muted);\">You're too early to have a promotion history<\u002Fli>\n        <\u002Ful>\n        <p class=\"arc\" style=\"font-size:var(--type-micro);color:var(--muted);margin:30px 0 0;line-height:1.5;font-weight:500;\">There's nothing to measure yet.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection><section data-label=\"Scope &amp; next step\" data-speaker-notes=\"Fixed scope, about two weeks. Pricing stays off the deck — it's a flat fee, discussed live on a call (B2B). Optional ongoing support to check each new promotion. My export app pulls the 12-month order and line-item data, discounts, and COGS automatically, and reconstructs most promotions from the data. From you I just need the context that isn't in Shopify: what marketing ran alongside each promotion, the intent behind the main ones, and any costs the export misses.\" style=\"height:100%;background:var(--white);color:var(--ink);font-family:'Archivo',sans-serif;padding:var(--pad);display:flex;flex-direction:column;position:relative;overflow:hidden;\">\n    <div class=\"eyebrow\"><span class=\"sq\"><\u002Fspan><span class=\"tx\">Scope, timeline &amp; next step<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1.15fr 0.85fr;gap:80px;flex:1;align-content:center;\">\n      <div>\n        <div style=\"display:flex;gap:48px;margin-bottom:40px;\">\n          <div><div class=\"gro\" style=\"font-size:16px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;\">Scope<\u002Fdiv><div class=\"gro\" style=\"font-size:34px;font-weight:700;\">Fixed scope<\u002Fdiv><\u002Fdiv>\n          <div><div class=\"gro\" style=\"font-size:16px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;\">Timeline<\u002Fdiv><div class=\"gro\" style=\"font-size:34px;font-weight:700;\">~2 weeks<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <h2 class=\"gro\" style=\"font-size:70px;line-height:1.05;margin:0;letter-spacing:-.03em;border-top:2px solid var(--ink);padding-top:34px;font-weight:700;\">Send me 12 months of orders. <span style=\"color:var(--red);\">I'll tell you which types of promotions work.<\u002Fspan><\u002Fh2>\n        <p class=\"arc\" style=\"font-size:24px;line-height:1.5;color:var(--faint);margin:26px 0 0;font-weight:500;\">One question, one answer, one result you keep. Optional ongoing support to check each new promotion as you run it.<\u002Fp>\n      <\u002Fdiv><div style=\"background:var(--panel);padding:44px;border-top:5px solid var(--red);align-self:start;margin-top:114px;\">\n        <div class=\"gro\" style=\"font-size:18px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--red);margin-bottom:24px;\">What I need from you<\u002Fdiv>\n        <ul style=\"list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:20px;\">\n          <li class=\"arc\" style=\"font-size:var(--type-micro);line-height:1.4;display:flex;gap:14px;font-weight:500;\"><span class=\"gro\" style=\"color:var(--red);font-weight:700;\">—<\u002Fspan>A few minutes to install my export app — it collects 12+ months of orders, line items, discounts, and COGS.<\u002Fli>\n          <li class=\"arc\" style=\"font-size:var(--type-micro);line-height:1.4;display:flex;gap:14px;font-weight:500;\"><span class=\"gro\" style=\"color:var(--red);font-weight:700;\">—<\u002Fspan>What else ran alongside each promotion that the data can't see: email, paid ads, a launch.<\u002Fli>\n          <li class=\"arc\" style=\"font-size:var(--type-micro);line-height:1.4;display:flex;gap:14px;font-weight:500;\"><span class=\"gro\" style=\"color:var(--red);font-weight:700;\">—<\u002Fspan>Context Shopify doesn't hold: why you ran the main promotions, and any costs the export missed.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      \n    <\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:11px 30px;border-top:2px solid var(--ink);padding-top:26px;\">\n      <a href=\"https://pavel.logacev.de\" style=\"display:inline-flex;align-items:center;gap:9px;color:var(--ink);text-decoration:none;\"><svg width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><path d=\"M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20\"><\u002Fpath><path d=\"M2 12h20\"><\u002Fpath><\u002Fsvg><span class=\"gro\" style=\"font-size:20px;font-weight:600;\">pavel.logacev.de<\u002Fspan><\u002Fa>\n      <a href=\"mailto:pavel@logacev.de\" style=\"display:inline-flex;align-items:center;gap:9px;color:var(--ink);text-decoration:none;\"><svg width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"4\" width=\"20\" height=\"16\" rx=\"2\"><\u002Frect><path d=\"m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7\"><\u002Fpath><\u002Fsvg><span class=\"gro\" style=\"font-size:20px;font-weight:600;\">pavel@logacev.de<\u002Fspan><\u002Fa>\n      <a href=\"https://calendly.com/pavel-logacev/price_optim\" style=\"display:inline-flex;align-items:center;gap:9px;color:var(--ink);text-decoration:none;\"><svg width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"18\" height=\"18\" x=\"3\" y=\"4\" rx=\"2\"><\u002Frect><path d=\"M3 10h18\"><\u002Fpath><path d=\"M8 2v4\"><\u002Fpath><path d=\"M16 2v4\"><\u002Fpath><\u002Fsvg><span class=\"gro\" style=\"font-size:20px;font-weight:600;\">Book a call<\u002Fspan><\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  \n\n<\u002Fx-import>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
