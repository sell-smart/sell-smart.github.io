project:
  type: website
  output-dir: docs
  resources:
    - CNAME
    - google80633a22d46b507f.html
    - case_studies/*/slides.html
    - services/*.html
    - 404.html
  render:
    - "**/*.qmd"
    - "!**/slides.qmd"

website:
  title: "Pavel Logačev"
  site-url: https://sell-smart.github.io
  description: "Pricing & Revenue Optimization Data Scientist"
  page-navigation: true
  back-to-top-navigation: true
  open-graph:
    image: assets/images/pavel.png
  twitter-card:
    image: assets/images/pavel.png

  navbar:
    right:
      - text: About
        aria-label: "About"
        href: about.qmd
      - text: Services
        aria-label: "Services"
        href: services.qmd
      # - text: Profitable Pricing
      #   aria-label: "Profitable Pricing"
      #   href: pricing.qmd
      - text: Case Studies
        aria-label: "Case Studies"
        href: case_studies/index.qmd
      - text: Contact
        aria-label: "Contact"
        href: contact.qmd

format:
  html:
    theme:
      light:
        - cosmo
        - assets/css/custom.scss
    code-link: true
    pagetitle: "{{< meta title >}}"
    lightbox: true
    include-in-header:
      - _includes/fonts.html
      - _includes/ga4-tracking.html

execute:
  freeze: auto
