document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

--space-3: 24px;\n  --space-4: 32px;\n  --space-5: 48px;\n  --space-6: 64px;\n  --space-7: 88px;\n}\n\n<\u002Fstyle>\n<script src=\"f2b5d778-be3a-4ecf-aa8f-21830523d517\"><\u002Fscript>\n<style>\nhtml,body{margin:0;}\n.g{font-family:'Space Grotesk',system-ui,sans-serif;}\n.b{font-family:'Archivo',system-ui,sans-serif;}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<x-import component-from-global-scope=\"deck-stage\" from=\"a0b53ca7-21c2-490f-9a40-748c82d5a03e#/deck-stage.js\" width=\"1920\" height=\"1080\" hint-size=\"100%,100%\">\n\n<!-- SLIDE 1 — COVER -->\n<section data-label=\"Cover\" data-screen-label=\"01\" data-speaker-notes=\"One-liner. That stock has to move — the only question is how much margin you lose clearing it. One proof point up front: enterprise retail work.\" style=\"width:100%;height:100%;box-sizing:border-box;background:#fff;color:#111;padding:104px;display:flex;flex-direction:column;justify-content:space-between;font-family:'Archivo',sans-serif;\">\n  <div style=\"display:flex;justify-content:space-between;align-items:center;\">\n    <div class=\"g\" style=\"font-size:22px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;\">Markdown &amp; Clearance Optimization<\u002Fdiv>\n    <div class=\"g\" style=\"font-size:18px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#6B6B6B;\">Fixed scope · ~2 weeks<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"max-width:1500px;\">\n    <div class=\"g\" style=\"font-size:24px;font-weight:600;color:#E5484D;margin-bottom:32px;\">The question<\u002Fdiv>\n    <div class=\"g\" style=\"font-size:104px;font-weight:700;line-height:1.0;letter-spacing:-.03em;\">That stock has to move. How do you clear it while losing the <span style=\"color:#E5484D;\">least margin<\u002Fspan>?<\u002Fdiv>\n    <p class=\"b\" style=\"font-size:27px;line-height:1.5;font-weight:500;color:#444;margin:40px 0 0;\">Built on the markdown-optimization work I did for one of Europe's largest sports retailers — applied to your catalog.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:flex;justify-content:space-between;align-items:flex-end;border-top:2px solid #111;padding-top:28px;\">\n    <div>\n      <div class=\"g\" style=\"font-size:30px;font-weight:700;\">Pavel Logacev<\u002Fdiv>\n      <div style=\"font-size:22px;color:#6B6B6B;font-weight:500;margin-top:4px;\">Data science for growing Shopify brands<\u002Fdiv>\n      <div style=\"margin-top:20px;\"><x-import component-from-global-scope=\"DesignSystem_55c551.ContactRow\" calendly-href=\"https://calendly.com/pavel-logacev/markdown_clearance\" hint-size=\"700px,30px\"><\u002Fx-import><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"g\" style=\"font-size:18px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#111;text-align:right;\">Pricing · Promotion · Demand forecasting<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- SLIDE 2 — THE QUESTION -->\n<section data-label=\"The question\" data-screen-label=\"02\" data-speaker-notes=\"The markdown is happening anyway. The only decision is how deep, on what, and when.\" style=\"width:100%;height:100%;box-sizing:border-box;background:#fff;color:#111;padding:104px;display:flex;flex-direction:column;font-family:'Archivo',sans-serif;\">\n  <x-import component-from-global-scope=\"DesignSystem_55c551.Eyebrow\" label=\"The question you can't currently answer\" hint-size=\"100%,30px\"><\u002Fx-import>\n  <div style=\"flex:1;display:flex;flex-direction:column;justify-content:center;max-width:1480px;\">\n    <p class=\"b\" style=\"font-size:34px;line-height:1.5;font-weight:500;color:#444;margin:0 0 40px;\">You've got stock that's aging, seasonal, or end-of-life. It will not sell through at full price — <span style=\"color:#111;font-weight:600;\">that part is clear.<\u002Fspan><\u002Fp>\n    <div class=\"g\" style=\"font-size:60px;font-weight:600;line-height:1.18;letter-spacing:-.02em;\">Given it has to move, what discount path recovers the <span style=\"color:#E5484D;\">most cash<\u002Fspan> before it's worth nothing?<\u002Fdiv>\n    <p class=\"b\" style=\"font-size:30px;line-height:1.5;font-weight:500;margin-top:48px;border-top:2px solid #111;padding-top:32px;max-width:1320px;\">This is not the question \"should I discount?\" The markdown is happening anyway. The only decision is how deep, on what, and when — and done right, that decision is worth real money.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- SLIDE 3 — WHAT IT'S COSTING YOU (STAT) -->\n<section data-label=\"What it's costing you\" data-screen-label=\"03\" data-speaker-notes=\"20–40% of recoverable cash lost to flat time-based rules. Two ways to get it wrong: too shallow/slow = dead stock; too deep/early = margin given away.\" style=\"width:100%;height:100%;box-sizing:border-box;background:#fff;color:#111;padding:104px;display:flex;flex-direction:column;font-family:'Archivo',sans-serif;\">\n  <x-import component-from-global-scope=\"DesignSystem_55c551.Eyebrow\" label=\"What it's costing you\" hint-size=\"100%,30px\"><\u002Fx-import>\n  <div style=\"display:grid;grid-template-columns:.9fr 1.1fr;gap:72px;flex:1;align-items:center;\">\n    <div>\n      <div class=\"g\" style=\"font-size:170px;font-weight:700;line-height:.88;letter-spacing:-.04em;color:#E5484D;\">20–40%<\u002Fdiv>\n      <div class=\"g\" style=\"font-size:34px;font-weight:500;margin-top:28px;line-height:1.25;\">of recoverable cash is routinely lost to flat, time-based markdown rules.<\u002Fdiv>\n      <p class=\"b\" style=\"font-size:22px;color:#6B6B6B;font-weight:500;margin-top:20px;\">Illustrative — the gap depends on your catalog and timing.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border-left:1px solid rgba(17,17,17,.13);padding-left:56px;\">\n      <div class=\"g\" style=\"font-size:24px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#6B6B6B;margin-bottom:32px;\">Two ways to get it wrong — both easy to miss<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:28px;\">\n        <div style=\"border-top:5px solid #E5484D;background:#F4F4F1;padding:32px;\">\n          <div class=\"g\" style=\"font-size:28px;font-weight:600;\">Too shallow / too slow → dead stock<\u002Fdiv>\n          <p class=\"b\" style=\"font-size:24px;line-height:1.45;color:#444;font-weight:500;margin:12px 0 0;\">Cash is frozen, warehouse space is used up, and you end up selling at almost nothing.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"border-top:5px solid #E5484D;background:#F4F4F1;padding:32px;\">\n          <div class=\"g\" style=\"font-size:28px;font-weight:600;\">Too deep / too early → margin given away<\u002Fdiv>\n          <p class=\"b\" style=\"font-size:24px;line-height:1.45;color:#444;font-weight:500;margin:12px 0 0;\">You give away margin the product would have kept with a smaller cut, or a little more time.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"b\" style=\"font-size:24px;line-height:1.45;font-weight:500;margin-top:28px;\">Most stores use one fixed rule — \"20% off after 60 days\" — for products that behave very differently.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- SLIDE 4 — WHY YOUR APPS DON'T ANSWER IT -->\n<section data-label=\"Why your apps don't answer it\" data-screen-label=\"04\" data-speaker-notes=\"Clearance apps and Shopify automated discounts apply flat time rules. They don't model price response, ignore deadline and holding cost, never optimize the path.\" style=\"width:100%;height:100%;box-sizing:border-box;background:#fff;color:#111;padding:104px;display:flex;flex-direction:column;font-family:'Archivo',sans-serif;\">\n  <x-import component-from-global-scope=\"DesignSystem_55c551.Eyebrow\" label=\"Why your apps don't answer it\" hint-size=\"100%,30px\"><\u002Fx-import>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:72px;flex:1;align-items:center;\">\n    <div>\n      <div class=\"g\" style=\"font-size:50px;font-weight:600;line-height:1.18;letter-spacing:-.02em;\">Clearance apps and Shopify's automated discounts apply <span style=\"color:#E5484D;\">flat, time-based rules.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border-left:1px solid rgba(17,17,17,.13);padding-left:56px;display:flex;flex-direction:column;gap:32px;\">\n      <div style=\"display:flex;gap:24px;align-items:flex-start;\"><span class=\"g\" style=\"font-size:28px;font-weight:700;color:#E5484D;\">—<\u002Fspan><p class=\"b\" style=\"font-size:28px;line-height:1.45;font-weight:500;margin:0;\">They don't model how each product's sell-through responds to price.<\u002Fp><\u002Fdiv>\n      <div style=\"display:flex;gap:24px;align-items:flex-start;\"><span class=\"g\" style=\"font-size:28px;font-weight:700;color:#E5484D;\">—<\u002Fspan><p class=\"b\" style=\"font-size:28px;line-height:1.45;font-weight:500;margin:0;\">They ignore your clearance deadline and holding cost.<\u002Fp><\u002Fdiv>\n      <div style=\"display:flex;gap:24px;align-items:flex-start;\"><span class=\"g\" style=\"font-size:28px;font-weight:700;color:#E5484D;\">—<\u002Fspan><p class=\"b\" style=\"font-size:28px;line-height:1.45;font-weight:500;margin:0;\">They never optimize the path — the depth and timing of each cut.<\u002Fp><\u002Fdiv>\n      <p class=\"b\" style=\"font-size:28px;line-height:1.45;font-weight:600;margin:8px 0 0;border-top:2px solid #111;padding-top:28px;\">This is a constrained optimization problem — get the most cash back before a deadline — not a rule you set once. The app gives you a rule; the money is in the path.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- SLIDE 5 — WHAT I DELIVER -->\n<section data-label=\"What I deliver\" data-screen-label=\"05\" data-speaker-notes=\"A markdown plan for every product or group: starting depth, step-downs, timing. Recovers the most expected cash before the deadline. Plus clear-now vs hold-for-season.\" style=\"width:100%;height:100%;box-sizing:border-box;background:#111;color:#fff;padding:104px;display:flex;flex-direction:column;justify-content:center;font-family:'Archivo',sans-serif;\">\n  <div style=\"--text-primary:#fff;\"><x-import component-from-global-scope=\"DesignSystem_55c551.Eyebrow\" label=\"What I deliver\" hint-size=\"100%,30px\"><\u002Fx-import><\u002Fdiv>\n  <div class=\"g\" style=\"font-size:76px;font-weight:700;line-height:1.05;letter-spacing:-.03em;max-width:1500px;\">A markdown plan for every product or group.<\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:48px;margin-top:72px;max-width:1560px;\">\n    <div style=\"border-top:5px solid #E5484D;padding-top:28px;\"><div class=\"g\" style=\"font-size:30px;font-weight:600;\">Starting depth<\u002Fdiv><p class=\"b\" style=\"font-size:24px;line-height:1.45;color:rgba(255,255,255,.7);font-weight:500;margin:12px 0 0;\">How deep the first cut should be, per product or group.<\u002Fp><\u002Fdiv>\n    <div style=\"border-top:5px solid #E5484D;padding-top:28px;\"><div class=\"g\" style=\"font-size:30px;font-weight:600;\">Step-downs<\u002Fdiv><p class=\"b\" style=\"font-size:24px;line-height:1.45;color:rgba(255,255,255,.7);font-weight:500;margin:12px 0 0;\">When to cut again, and by how much.<\u002Fp><\u002Fdiv>\n    <div style=\"border-top:5px solid #E5484D;padding-top:28px;\"><div class=\"g\" style=\"font-size:30px;font-weight:600;\">Timing<\u002Fdiv><p class=\"b\" style=\"font-size:24px;line-height:1.45;color:rgba(255,255,255,.7);font-weight:500;margin:12px 0 0;\">Set by your remaining stock, deadline, and holding cost.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <p class=\"b\" style=\"font-size:28px;line-height:1.5;font-weight:500;color:rgba(255,255,255,.7);margin-top:64px;max-width:1400px;border-top:1px solid rgba(255,255,255,.18);padding-top:32px;\">The plan recovers the <span style=\"color:#fff;font-weight:600;\">most expected cash before your deadline<\u002Fspan>. Plus a clear decision: what to clear quickly now, and what to hold for seasonal demand.<\u002Fp>\n<\u002Fsection>\n\n<!-- SLIDE 6 — THE ARTIFACT -->\n<section data-label=\"The artifact\" data-screen-label=\"06\" data-speaker-notes=\"The visual deliverable. Left: the markdown path, flat rule vs optimized stepped path with sell-through. Right: cash recovered, two bars, +$35k delta. Same stock, same deadline — the difference is the path.\" style=\"width:100%;height:100%;box-sizing:border-box;background:#fff;color:#111;padding:80px 104px;display:flex;flex-direction:column;font-family:'Archivo',sans-serif;\">\n  <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:32px;\">\n    <div style=\"display:flex;align-items:center;gap:16px;\"><span style=\"width:14px;height:14px;background:#E5484D;\"><\u002Fspan><span class=\"g\" style=\"font-size:22px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;\">The artifact<\u002Fspan><\u002Fdiv>\n    <span class=\"g\" style=\"font-size:16px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:#fff;background:#E5484D;padding:7px 16px;\">Illustrative<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1.45fr 1fr;gap:56px;flex:1;align-items:stretch;\">\n\n    <!-- LEFT: markdown path -->\n    <div style=\"display:flex;flex-direction:column;\">\n      <div class=\"g\" style=\"font-size:26px;font-weight:600;margin-bottom:6px;\">The markdown path<\u002Fdiv>\n      <p class=\"b\" style=\"font-size:18px;color:#6B6B6B;font-weight:500;margin:0 0 14px;\">Price as % of full price, over weeks since flagged. Same aging SKU, two rules.<\u002Fp>\n      <svg viewBox=\"0 0 760 460\" style=\"width:100%;height:auto;flex:1;\">\n        <!-- axes -->\n        <line x1=\"70\" y1=\"30\" x2=\"70\" y2=\"380\" stroke=\"rgba(17,17,17,.25)\" stroke-width=\"1.5\"><\u002Fline>\n        <line x1=\"70\" y1=\"380\" x2=\"730\" y2=\"380\" stroke=\"rgba(17,17,17,.25)\" stroke-width=\"1.5\"><\u002Fline>\n        <!-- y labels (price %) : 100 at y=40, 50 at y=380 -->\n        <text x=\"58\" y=\"46\" text-anchor=\"end\" font-family=\"Space Grotesk\" font-size=\"15\" fill=\"#6B6B6B\">100%<\u002Ftext>\n        <text x=\"58\" y=\"148\" text-anchor=\"end\" font-family=\"Space Grotesk\" font-size=\"15\" fill=\"#6B6B6B\">85%<\u002Ftext>\n        <text x=\"58\" y=\"250\" text-anchor=\"end\" font-family=\"Space Grotesk\" font-size=\"15\" fill=\"#6B6B6B\">70%<\u002Ftext>\n        <text x=\"58\" y=\"352\" text-anchor=\"end\" font-family=\"Space Grotesk\" font-size=\"15\" fill=\"#6B6B6B\">55%<\u002Ftext>\n        <!-- deadline marker week 10 -->\n        <line x1=\"694\" y1=\"30\" x2=\"694\" y2=\"380\" stroke=\"#111\" stroke-width=\"1.5\" stroke-dasharray=\"5 5\"><\u002Fline>\n        <text x=\"694\" y=\"22\" text-anchor=\"middle\" font-family=\"Space Grotesk\" font-size=\"14\" font-weight=\"600\" fill=\"#111\">DEADLINE<\u002Ftext>\n        <!-- x labels weeks 0..10 ; x = 70 + w*62.4 -->\n        <text x=\"70\" y=\"402\" text-anchor=\"middle\" font-family=\"Space Grotesk\" font-size=\"14\" fill=\"#6B6B6B\">wk 0<\u002Ftext>\n        <text x=\"195\" y=\"402\" text-anchor=\"middle\" font-family=\"Space Grotesk\" font-size=\"14\" fill=\"#6B6B6B\">2<\u002Ftext>\n        <text x=\"382\" y=\"402\" text-anchor=\"middle\" font-family=\"Space Grotesk\" font-size=\"14\" fill=\"#6B6B6B\">5<\u002Ftext>\n        <text x=\"569\" y=\"402\" text-anchor=\"middle\" font-family=\"Space Grotesk\" font-size=\"14\" fill=\"#6B6B6B\">8<\u002Ftext>\n        <text x=\"694\" y=\"402\" text-anchor=\"middle\" font-family=\"Space Grotesk\" font-size=\"14\" fill=\"#6B6B6B\">10<\u002Ftext>\n\n        <!-- FLAT RULE: 100% until ~wk8.5 then 80%. y(100)=40,y(80)=176 -->\n        <polyline points=\"70,40 600,40 600,176 694,176\" fill=\"none\" stroke=\"#9A9A95\" stroke-width=\"3.5\"><\u002Fpolyline>\n        <!-- OPTIMIZED: 100->90(wk2)->75(wk5)->55(wk8). y(90)=108,y(75)=210,y(55)=346 -->\n        <polyline points=\"70,40 195,40 195,108 382,108 382,210 569,210 569,346 694,346\" fill=\"none\" stroke=\"#E5484D\" stroke-width=\"4\"><\u002Fpolyline>\n\n        <!-- sell-through annotations -->\n        <text x=\"430\" y=\"158\" font-family=\"Archivo\" font-size=\"14\" font-weight=\"600\" fill=\"#9A9A95\">flat: 41% sold by deadline<\u002Ftext>\n        <text x=\"300\" y=\"330\" font-family=\"Archivo\" font-size=\"14\" font-weight=\"600\" fill=\"#E5484D\">optimized: 94% sold by deadline<\u002Ftext>\n      <\u002Fsvg>\n      <div style=\"display:flex;gap:28px;margin-top:10px;\">\n        <div style=\"display:flex;align-items:center;gap:10px;\"><span style=\"width:26px;height:4px;background:#9A9A95;display:inline-block;\"><\u002Fspan><span class=\"b\" style=\"font-size:18px;font-weight:600;\">−20% after 60 days (flat rule)<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:10px;\"><span style=\"width:26px;height:4px;background:#E5484D;display:inline-block;\"><\u002Fspan><span class=\"b\" style=\"font-size:18px;font-weight:600;\">−10/−25/−45% stepped (optimized)<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- RIGHT: cash recovered -->\n    <div style=\"display:flex;flex-direction:column;border-left:1px solid rgba(17,17,17,.13);padding-left:48px;\">\n      <div class=\"g\" style=\"font-size:26px;font-weight:600;margin-bottom:6px;\">Cash recovered<\u002Fdiv>\n      <p class=\"b\" style=\"font-size:18px;color:#6B6B6B;font-weight:500;margin:0 0 14px;\">Same starting stock, same deadline.<\u002Fp>\n      <svg viewBox=\"0 0 380 400\" style=\"width:100%;height:auto;flex:1;\">\n        <line x1=\"40\" y1=\"20\" x2=\"40\" y2=\"330\" stroke=\"rgba(17,17,17,.25)\" stroke-width=\"1.5\"><\u002Fline>\n        <line x1=\"40\" y1=\"330\" x2=\"360\" y2=\"330\" stroke=\"rgba(17,17,17,.25)\" stroke-width=\"1.5\"><\u002Fline>\n        <!-- flat bar: value ~ 100, height 120 -->\n        <rect x=\"95\" y=\"210\" width=\"100\" height=\"120\" fill=\"#9A9A95\"><\u002Frect>\n        <text x=\"145\" y=\"200\" text-anchor=\"middle\" font-family=\"Space Grotesk\" font-size=\"20\" font-weight=\"700\" fill=\"#9A9A95\">$100k<\u002Ftext>\n        <text x=\"145\" y=\"354\" text-anchor=\"middle\" font-family=\"Space Grotesk\" font-size=\"16\" font-weight=\"600\" fill=\"#111\">Flat rule<\u002Ftext>\n        <!-- optimized bar: value ~135, height 230 -->\n        <rect x=\"235\" y=\"100\" width=\"100\" height=\"230\" fill=\"#E5484D\"><\u002Frect>\n        <text x=\"285\" y=\"90\" text-anchor=\"middle\" font-family=\"Space Grotesk\" font-size=\"20\" font-weight=\"700\" fill=\"#E5484D\">$135k<\u002Ftext>\n        <text x=\"285\" y=\"354\" text-anchor=\"middle\" font-family=\"Space Grotesk\" font-size=\"16\" font-weight=\"600\" fill=\"#111\">Optimized<\u002Ftext>\n        <!-- delta bracket -->\n        <line x1=\"195\" y1=\"100\" x2=\"235\" y2=\"100\" stroke=\"#111\" stroke-width=\"1.5\" stroke-dasharray=\"4 4\"><\u002Fline>\n      <\u002Fsvg>\n      <div style=\"background:#111;color:#fff;padding:24px 28px;margin-top:8px;\">\n        <div class=\"g\" style=\"font-size:40px;font-weight:700;color:#E5484D;line-height:1;\">+$35k<\u002Fdiv>\n        <div class=\"b\" style=\"font-size:18px;font-weight:600;margin-top:8px;\">recovered on the same inventory<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p class=\"g\" style=\"font-size:22px;font-weight:600;text-align:center;margin:26px 0 0;letter-spacing:-.01em;\">Same stock, same deadline. The difference is <span style=\"color:#E5484D;\">the path.<\u002Fspan><\u002Fp>\n<\u002Fsection>\n\n<!-- SLIDE 7 — WHAT YOU WALK AWAY WITH (GRID) -->\n<section data-label=\"What you walk away with\" data-screen-label=\"07\" data-speaker-notes=\"Per-SKU/group schedule; expected sell-through and recovered cash vs current rule; clear-vs-hold flag; a repeatable rule you keep.\" style=\"width:100%;height:100%;box-sizing:border-box;background:#fff;color:#111;padding:104px;display:flex;flex-direction:column;font-family:'Archivo',sans-serif;\">\n  <x-import component-from-global-scope=\"DesignSystem_55c551.Eyebrow\" label=\"What you walk away with\" hint-size=\"100%,30px\"><\u002Fx-import>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:32px;flex:1;align-content:center;\">\n    <div style=\"border-top:5px solid #E5484D;background:#F4F4F1;padding:42px;\"><div class=\"g\" style=\"font-size:24px;font-weight:700;color:#E5484D;margin-bottom:16px;\">01<\u002Fdiv><div class=\"g\" style=\"font-size:32px;font-weight:600;line-height:1.15;\">A per-SKU / group markdown schedule<\u002Fdiv><p class=\"b\" style=\"font-size:24px;line-height:1.45;color:#444;font-weight:500;margin:14px 0 0;\">Where to start, when to step down, and by how much.<\u002Fp><\u002Fdiv>\n    <div style=\"border-top:5px solid #E5484D;background:#F4F4F1;padding:42px;\"><div class=\"g\" style=\"font-size:24px;font-weight:700;color:#E5484D;margin-bottom:16px;\">02<\u002Fdiv><div class=\"g\" style=\"font-size:32px;font-weight:600;line-height:1.15;\">Expected sell-through &amp; recovered cash<\u002Fdiv><p class=\"b\" style=\"font-size:24px;line-height:1.45;color:#444;font-weight:500;margin:14px 0 0;\">Under the plan, compared with what your current rule loses.<\u002Fp><\u002Fdiv>\n    <div style=\"border-top:5px solid #E5484D;background:#F4F4F1;padding:42px;\"><div class=\"g\" style=\"font-size:24px;font-weight:700;color:#E5484D;margin-bottom:16px;\">03<\u002Fdiv><div class=\"g\" style=\"font-size:32px;font-weight:600;line-height:1.15;\">A clear-vs-hold flag<\u002Fdiv><p class=\"b\" style=\"font-size:24px;line-height:1.45;color:#444;font-weight:500;margin:14px 0 0;\">Which aging stock to clear quickly, and which recovers more by waiting for seasonal demand.<\u002Fp><\u002Fdiv>\n    <div style=\"border-top:5px solid #E5484D;background:#111;color:#fff;padding:42px;\"><div class=\"g\" style=\"font-size:24px;font-weight:700;color:#E5484D;margin-bottom:16px;\">04<\u002Fdiv><div class=\"g\" style=\"font-size:32px;font-weight:600;line-height:1.15;\">A repeatable rule you keep<\u002Fdiv><p class=\"b\" style=\"font-size:24px;line-height:1.45;color:rgba(255,255,255,.7);font-weight:500;margin:14px 0 0;\">Apply it to next season's leftovers without me.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- SLIDE 8 — HOW IT WORKS -->\n<section data-label=\"How it works\" data-screen-label=\"08\" data-speaker-notes=\"Estimate demand-at-each-price; bring in constraints; solve for the path; split clear vs hold. Methods: price-response estimation, sell-through optimization over time, hierarchical pooling.\" style=\"width:100%;height:100%;box-sizing:border-box;background:#fff;color:#111;padding:104px;display:flex;flex-direction:column;font-family:'Archivo',sans-serif;\">\n  <x-import component-from-global-scope=\"DesignSystem_55c551.Eyebrow\" label=\"How it works\" hint-size=\"100%,30px\"><\u002Fx-import>\n  <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:0;flex:1;align-content:center;\">\n    <div style=\"padding:0 36px 0 0;border-right:1px solid rgba(17,17,17,.13);\"><div class=\"g\" style=\"font-size:56px;font-weight:700;color:#E5484D;line-height:1;\">1<\u002Fdiv><div class=\"g\" style=\"font-size:28px;font-weight:600;line-height:1.2;margin-top:24px;\">Estimate demand-at-each-price<\u002Fdiv><p class=\"b\" style=\"font-size:23px;line-height:1.45;color:#444;font-weight:500;margin:16px 0 0;\">From the stock's own history — and where data is thin, by using patterns from similar items.<\u002Fp><\u002Fdiv>\n    <div style=\"padding:0 36px;border-right:1px solid rgba(17,17,17,.13);\"><div class=\"g\" style=\"font-size:56px;font-weight:700;color:#E5484D;line-height:1;\">2<\u002Fdiv><div class=\"g\" style=\"font-size:28px;font-weight:600;line-height:1.2;margin-top:24px;\">Bring in the constraints<\u002Fdiv><p class=\"b\" style=\"font-size:23px;line-height:1.45;color:#444;font-weight:500;margin:16px 0 0;\">Remaining units, clearance deadline, and holding cost per week.<\u002Fp><\u002Fdiv>\n    <div style=\"padding:0 36px;border-right:1px solid rgba(17,17,17,.13);\"><div class=\"g\" style=\"font-size:56px;font-weight:700;color:#E5484D;line-height:1;\">3<\u002Fdiv><div class=\"g\" style=\"font-size:28px;font-weight:600;line-height:1.2;margin-top:24px;\">Solve for the path<\u002Fdiv><p class=\"b\" style=\"font-size:23px;line-height:1.45;color:#444;font-weight:500;margin:16px 0 0;\">The path that recovers the most expected margin before the deadline.<\u002Fp><\u002Fdiv>\n    <div style=\"padding:0 0 0 36px;\"><div class=\"g\" style=\"font-size:56px;font-weight:700;color:#E5484D;line-height:1;\">4<\u002Fdiv><div class=\"g\" style=\"font-size:28px;font-weight:600;line-height:1.2;margin-top:24px;\">Split clear vs. hold<\u002Fdiv><p class=\"b\" style=\"font-size:23px;line-height:1.45;color:#444;font-weight:500;margin:16px 0 0;\">Flag the stock that recovers more by waiting, against the stock to clear now.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <p class=\"b\" style=\"font-size:22px;font-weight:500;color:#6B6B6B;margin-top:48px;border-top:2px solid #111;padding-top:24px;\"><span class=\"g\" style=\"color:#111;font-weight:600;text-transform:uppercase;letter-spacing:.1em;font-size:18px;\">Methods<\u002Fspan> &nbsp; price-response estimation · sell-through optimization over time · hierarchical pooling for items with little data<\u002Fp>\n<\u002Fsection>\n\n<!-- SLIDE 9 — TRACK RECORD / WHO'S BEHIND THIS -->\n<section data-label=\"Track record\" data-screen-label=\"09\" data-speaker-notes=\"Built the markdown rulebook and optimization tool for a global sports retailer — end-of-life and seasonal stock across very large catalogs. Also QSR and coffee chains. PhD + six years of research before that.\" style=\"width:100%;height:100%;box-sizing:border-box;background:#fff;color:#111;padding:104px;display:flex;flex-direction:column;font-family:'Archivo',sans-serif;\">\n  <x-import component-from-global-scope=\"DesignSystem_55c551.Eyebrow\" label=\"Track record\" hint-size=\"100%,30px\"><\u002Fx-import>\n  <div style=\"flex:1;display:flex;flex-direction:column;justify-content:center;gap:44px;max-width:1600px;\">\n    <div style=\"display:flex;gap:40px;align-items:flex-start;\">\n      <div class=\"g\" style=\"font-size:40px;font-weight:700;color:#E5484D;flex:0 0 340px;\">Global sports retailer<\u002Fdiv>\n      <div class=\"g\" style=\"font-size:38px;font-weight:600;line-height:1.25;letter-spacing:-.01em;\">Built the markdown rulebook and markdown-optimization tool — the logic that decides how deep and when to mark down end-of-life and seasonal stock across very large catalogs. <span style=\"color:#E5484D;\">This offer is that same work, applied to a Shopify catalog.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:64px;border-top:2px solid #111;padding-top:36px;\">\n      <div>\n        <div class=\"g\" style=\"font-size:18px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#6B6B6B;margin-bottom:16px;\">Also built for<\u002Fdiv>\n        <p class=\"b\" style=\"font-size:26px;line-height:1.5;font-weight:500;margin:0;\"><span class=\"g\" style=\"font-weight:600;\">Major quick-service restaurant and coffee chains<\u002Fspan> — pricing, promotion, and demand-forecasting models.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border-left:1px solid rgba(17,17,17,.13);padding-left:48px;\">\n        <div class=\"g\" style=\"font-size:18px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#6B6B6B;margin-bottom:16px;\">Background<\u002Fdiv>\n        <p class=\"b\" style=\"font-size:26px;line-height:1.5;font-weight:500;margin:0;\">Four years building these models for large retailers. Before that, a PhD and six years of causal and statistical research.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p class=\"b\" style=\"font-size:28px;line-height:1.5;font-weight:600;margin:0;\">These methods are standard at large retailers — and almost never used at Shopify scale. <span style=\"color:#E5484D;\">That is the gap this offer fills.<\u002Fspan><\u002Fp>\n  <\u002Fdiv>\n  <div style=\"border-top:2px solid #111;padding-top:28px;\"><x-import component-from-global-scope=\"DesignSystem_55c551.ContactRow\" calendly-href=\"https://calendly.com/pavel-logacev/markdown_clearance\" hint-size=\"700px,30px\"><\u002Fx-import><\u002Fdiv>\n<\u002Fsection>\n\n<!-- SLIDE 10 — IS THIS YOU -->\n<section data-label=\"Is this you?\" data-screen-label=\"10\" data-speaker-notes=\"Good fit: fashion/seasonal/perishable, regular aging stock, real depth, recurring clearance. Not a fit: evergreen, tiny catalog, one-off items with no similar history. I'll tell you clearly.\" style=\"width:100%;height:100%;box-sizing:border-box;background:#fff;color:#111;padding:104px;display:flex;flex-direction:column;font-family:'Archivo',sans-serif;\">\n  <x-import component-from-global-scope=\"DesignSystem_55c551.Eyebrow\" label=\"Is this you?\" hint-size=\"100%,30px\"><\u002Fx-import>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:48px;flex:1;align-content:center;\">\n    <div style=\"display:flex;flex-direction:column;gap:6px;\">\n      <div style=\"height:5px;background:#E5484D;\"><\u002Fdiv>\n      <div style=\"background:#F4F4F1;padding:56px;flex:1;display:flex;flex-direction:column;\">\n        <div class=\"g\" style=\"font-size:20px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#E5484D;margin-bottom:32px;\">Good fit<\u002Fdiv>\n        <p class=\"b\" style=\"font-size:30px;line-height:1.42;font-weight:500;margin:0;\">Fashion, seasonal, perishable, or any catalog with <span style=\"font-weight:700;\">regular end-of-life / aging stock and real depth<\u002Fspan> — enough SKUs and history that optimizing the path beats guessing by eye.<\u002Fp>\n        <p class=\"b\" style=\"font-size:30px;line-height:1.42;font-weight:700;margin:24px 0 0;\">A recurring clearance problem — every season, every drop.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:6px;\">\n      <div style=\"height:5px;background:#111;\"><\u002Fdiv>\n      <div style=\"background:#111;color:#fff;padding:56px;flex:1;display:flex;flex-direction:column;\">\n        <div class=\"g\" style=\"font-size:20px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#E5484D;margin-bottom:32px;\">Not a fit<\u002Fdiv>\n        <p class=\"b\" style=\"font-size:30px;line-height:1.42;font-weight:500;margin:0;color:#fff;\">An evergreen catalog with no aging problem. A catalog small enough to plan in your head. One-off or unique items with no similar history to estimate demand from.<\u002Fp>\n        <p class=\"b\" style=\"font-size:22px;line-height:1.5;font-weight:500;color:rgba(255,255,255,.7);margin:28px 0 0;\">I'll tell you clearly which side you're on.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- SLIDE 11 — QUESTIONS I OFTEN HEAR -->\n<section data-label=\"Questions I often hear\" data-screen-label=\"11\" data-speaker-notes=\"I just discount until it sells — that's the flat rule, loses 20–40%. My app does markdowns — applies a time rule only. No history — thin-data case, use signal from similar items.\" style=\"width:100%;height:100%;box-sizing:border-box;background:#fff;color:#111;padding:104px;display:flex;flex-direction:column;font-family:'Archivo',sans-serif;\">\n  <x-import component-from-global-scope=\"DesignSystem_55c551.Eyebrow\" label=\"Questions I often hear\" hint-size=\"100%,30px\"><\u002Fx-import>\n  <div style=\"display:flex;flex-direction:column;gap:28px;flex:1;justify-content:center;\">\n    <div style=\"display:grid;grid-template-columns:.85fr 1.15fr;gap:48px;align-items:start;border-top:1px solid rgba(17,17,17,.13);padding-top:28px;\">\n      <div class=\"g\" style=\"font-size:30px;font-weight:600;line-height:1.25;\">\"I just discount until it sells.\"<\u002Fdiv>\n      <p class=\"b\" style=\"font-size:26px;line-height:1.45;font-weight:500;color:#444;margin:0;\">That's the flat rule — it works, and it routinely loses <span style=\"color:#E5484D;font-weight:600;\">20–40% of recoverable cash<\u002Fspan>. The plan recovers more from the exact same stock.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:.85fr 1.15fr;gap:48px;align-items:start;border-top:1px solid rgba(17,17,17,.13);padding-top:28px;\">\n      <div class=\"g\" style=\"font-size:30px;font-weight:600;line-height:1.25;\">\"My app already does automated markdowns.\"<\u002Fdiv>\n      <p class=\"b\" style=\"font-size:26px;line-height:1.45;font-weight:500;color:#444;margin:0;\">It applies a time rule. It doesn't model price response, your deadline, or holding cost, and it doesn't optimize the path. <span style=\"color:#E5484D;font-weight:600;\">That's the whole gap.<\u002Fspan><\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:.85fr 1.15fr;gap:48px;align-items:start;border-top:1px solid rgba(17,17,17,.13);padding-top:28px;\">\n      <div class=\"g\" style=\"font-size:30px;font-weight:600;line-height:1.25;\">\"I don't have much history on this stock.\"<\u002Fdiv>\n      <p class=\"b\" style=\"font-size:26px;line-height:1.45;font-weight:500;color:#444;margin:0;\">That's the case with thin data — I use signal from similar items instead of giving no answer. If there is genuinely nothing similar, I'll say so.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- SLIDE 12 — WHAT I NEED FROM YOU -->\n<section data-label=\"What I need from you\" data-screen-label=\"12\" data-speaker-notes=\"Order and line-item history incl past markdowns; current aging-stock levels and hold window; clearance deadlines / seasonal calendar; COGS and holding cost if available. Step one is a data check — early honesty.\" style=\"width:100%;height:100%;box-sizing:border-box;background:#111;color:#fff;padding:104px;display:flex;flex-direction:column;font-family:'Archivo',sans-serif;\">\n  <div style=\"--text-primary:#fff;\"><x-import component-from-global-scope=\"DesignSystem_55c551.Eyebrow\" label=\"What I need from you\" hint-size=\"100%,30px\"><\u002Fx-import><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:32px;flex:1;align-content:center;\">\n    <div style=\"border-top:5px solid #E5484D;padding:36px 0 0;\"><div class=\"g\" style=\"font-size:32px;font-weight:600;line-height:1.2;\">Order &amp; line-item history<\u002Fdiv><p class=\"b\" style=\"font-size:24px;line-height:1.45;color:rgba(255,255,255,.7);font-weight:500;margin:14px 0 0;\">Including past markdowns and how they sold through.<\u002Fp><\u002Fdiv>\n    <div style=\"border-top:5px solid #E5484D;padding:36px 0 0;\"><div class=\"g\" style=\"font-size:32px;font-weight:600;line-height:1.2;\">Current aging-stock levels<\u002Fdiv><p class=\"b\" style=\"font-size:24px;line-height:1.45;color:rgba(255,255,255,.7);font-weight:500;margin:14px 0 0;\">And how long you can hold them.<\u002Fp><\u002Fdiv>\n    <div style=\"border-top:5px solid #E5484D;padding:36px 0 0;\"><div class=\"g\" style=\"font-size:32px;font-weight:600;line-height:1.2;\">Clearance deadlines<\u002Fdiv><p class=\"b\" style=\"font-size:24px;line-height:1.45;color:rgba(255,255,255,.7);font-weight:500;margin:14px 0 0;\">Your seasonal calendar.<\u002Fp><\u002Fdiv>\n    <div style=\"border-top:5px solid #E5484D;padding:36px 0 0;\"><div class=\"g\" style=\"font-size:32px;font-weight:600;line-height:1.2;\">COGS &amp; holding cost<\u002Fdiv><p class=\"b\" style=\"font-size:24px;line-height:1.45;color:rgba(255,255,255,.7);font-weight:500;margin:14px 0 0;\">If you have them.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <p class=\"b\" style=\"font-size:26px;line-height:1.5;font-weight:500;color:rgba(255,255,255,.85);margin-top:48px;border-top:1px solid rgba(255,255,255,.18);padding-top:32px;\">Step one is always a data check. If your data cannot support a reliable answer, <span style=\"color:#fff;font-weight:600;\">you hear it in the first days — not at the end.<\u002Fspan><\u002Fp>\n<\u002Fsection>\n\n<!-- SLIDE 13 — SCOPE & TIMELINE -->\n<section data-label=\"Scope &amp; timeline\" data-screen-label=\"13\" data-speaker-notes=\"Fixed-scope diagnostic, ~2 weeks. Anchor the value: +$35k recovered on one season's stock in the example, repeating each clearance cycle. Optional retainer. Pricing is discussed in conversation, not in the deck.\" style=\"width:100%;height:100%;box-sizing:border-box;background:#fff;color:#111;padding:104px;display:flex;flex-direction:column;font-family:'Archivo',sans-serif;\">\n  <x-import component-from-global-scope=\"DesignSystem_55c551.Eyebrow\" label=\"Scope &amp; timeline\" hint-size=\"100%,30px\"><\u002Fx-import>\n  <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:48px;margin-bottom:56px;\">\n    <div><div class=\"g\" style=\"font-size:20px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#6B6B6B;margin-bottom:18px;\">Scope<\u002Fdiv><div class=\"g\" style=\"font-size:44px;font-weight:700;line-height:1.1;\">Fixed-scope diagnostic<\u002Fdiv><\u002Fdiv>\n    <div style=\"border-left:1px solid rgba(17,17,17,.13);padding-left:48px;\"><div class=\"g\" style=\"font-size:20px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#6B6B6B;margin-bottom:18px;\">Timeline<\u002Fdiv><div class=\"g\" style=\"font-size:44px;font-weight:700;line-height:1.1;\">~2 weeks<\u002Fdiv><\u002Fdiv>\n    <div style=\"border-left:1px solid rgba(17,17,17,.13);padding-left:48px;\"><div class=\"g\" style=\"font-size:20px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#6B6B6B;margin-bottom:18px;\">Deliverable<\u002Fdiv><div class=\"g\" style=\"font-size:44px;font-weight:700;line-height:1.1;color:#E5484D;\">A rule you keep<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"border-top:5px solid #E5484D;background:#F4F4F1;padding:36px 42px;margin-bottom:48px;max-width:1500px;\">\n    <p class=\"b\" style=\"font-size:27px;line-height:1.5;font-weight:500;margin:0;\">In the illustrative example on slide 06, the optimized path recovered <span class=\"g\" style=\"color:#E5484D;font-weight:700;\">+$35k on one season's stock<\u002Fspan> — and the result repeats every clearance cycle.<\u002Fp>\n  <\u002Fdiv>\n  <p class=\"b\" style=\"font-size:30px;line-height:1.5;font-weight:500;max-width:1500px;\">You don't buy \"data science consulting.\" You buy a clear result — <span class=\"g\" style=\"font-weight:600;\">one question, one answer, one deliverable you keep.<\u002Fspan> Optional retainer to run it every season.<\u002Fp>\n<\u002Fsection>\n\n<!-- SLIDE 14 — NEXT STEP -->\n<section data-label=\"Next step\" data-screen-label=\"14\" data-speaker-notes=\"Two exports from Shopify admin, about 15 minutes. I'll show you what your current markdown rule is losing. No commitment at this step.\" style=\"width:100%;height:100%;box-sizing:border-box;background:#fff;color:#111;padding:104px;display:flex;flex-direction:column;justify-content:space-between;font-family:'Archivo',sans-serif;\">\n  <x-import component-from-global-scope=\"DesignSystem_55c551.Eyebrow\" label=\"Next step\" hint-size=\"100%,30px\"><\u002Fx-import>\n  <div style=\"max-width:1560px;\">\n    <div class=\"g\" style=\"font-size:88px;font-weight:700;line-height:1.05;letter-spacing:-.03em;\">Send two exports from your Shopify admin.<\u002Fdiv>\n    <p class=\"b\" style=\"font-size:30px;line-height:1.5;font-weight:500;color:#444;margin:32px 0 0;\">Your aging-stock list and your sales history — about 15 minutes of your time.<\u002Fp>\n    <div class=\"g\" style=\"font-size:48px;font-weight:600;line-height:1.2;color:#E5484D;margin-top:40px;\">I'll show you what your current markdown rule is losing.<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:flex;justify-content:space-between;align-items:flex-end;border-top:2px solid #111;padding-top:28px;\">\n    <div>\n      <div class=\"g\" style=\"font-size:30px;font-weight:700;\">Pavel Logacev<\u002Fdiv>\n      <div style=\"font-size:22px;color:#6B6B6B;font-weight:500;margin-top:4px;\">Data science for growing Shopify brands<\u002Fdiv>\n      <div style=\"margin-top:20px;\"><x-import component-from-global-scope=\"DesignSystem_55c551.ContactRow\" calendly-href=\"https://calendly.com/pavel-logacev/markdown_clearance\" hint-size=\"700px,30px\"><\u002Fx-import><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"g\" style=\"font-size:18px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#111;text-align:right;\">Pricing · Promotion · Demand forecasting<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fx-import>\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
